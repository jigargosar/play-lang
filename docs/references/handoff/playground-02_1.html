<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:         #000000;
    --panel:      #080808;
    --panel2:     #0d0d0d;
    --border:     #1a1a1a;
    --border2:    #242424;
    --accent:     oklch(80% 0.28 145);
    --accent-dim: oklch(40% 0.15 145);
    --accent-glow:oklch(80% 0.28 145 / 0.15);
    --text:       #c8c8c8;
    --muted:      #3a3a3a;
    --muted2:     #555;
    --success:    oklch(72% 0.22 145);
    --error:      oklch(65% 0.22 25);
    --pending:    oklch(75% 0.18 80);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    height: 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    flex-shrink: 0;
    background: var(--panel);
  }

  .logo {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-mark {
    width: 16px;
    height: 16px;
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: var(--accent);
    flex-shrink: 0;
  }

  .badge {
    font-size: 9px;
    padding: 2px 6px;
    border: 1px solid var(--border2);
    color: var(--muted2);
    letter-spacing: 0.08em;
    background: transparent;
  }

  .spacer { flex: 1; }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--success);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .status-dot.error   { background: var(--error); }
  .status-dot.pending { background: var(--pending); }
  .status-label {
    font-size: 10px;
    color: var(--muted2);
    letter-spacing: 0.06em;
    min-width: 54px;
  }

  /* ── Main ── */
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Panels ── */
  .panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 80px;
    min-height: 0;
  }

  .panel-bar {
    height: 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
    flex-shrink: 0;
    background: var(--panel2);
  }

  .panel-label {
    font-size: 9px;
    color: var(--muted2);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .panel-name {
    font-size: 10px;
    color: var(--muted2);
    opacity: 0.6;
  }

  .panel-indicator {
    margin-left: auto;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent-dim);
  }

  #editor-container {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* ── Divider ── */
  .divider {
    width: 1px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
    transition: background 0.15s;
  }
  .divider::after {
    content: '';
    position: absolute;
    inset: 0 -4px;
  }
  .divider:hover,
  .divider.dragging {
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent-glow);
  }

  /* ── Preview ── */
  #preview-panel {
    flex: 1;
    min-width: 80px;
  }

  #preview-frame {
    display: block;
    width: 100%;
    flex: 1;
    border: none;
    background: #000;
    min-height: 0;
  }

  /* ── Footer ── */
  .footer {
    height: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 18px;
    flex-shrink: 0;
    background: var(--panel);
  }

  .footer-item {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  .footer-item b {
    color: var(--muted2);
    font-weight: 400;
  }

  .footer-right {
    margin-left: auto;
    font-size: 9px;
    color: var(--border2);
    letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">▸</div>
    play
  </div>
  <div class="badge">v0.1</div>
  <div class="badge">phase 1</div>
  <div class="spacer"></div>
  <div class="status">
    <div class="status-dot" id="status-dot"></div>
    <div class="status-label" id="status-label">ready</div>
  </div>
</div>

<div class="main" id="main">

  <div class="panel" id="editor-panel" style="width:50%">
    <div class="panel-bar">
      <div class="panel-label">editor</div>
      <div class="panel-name">index.play</div>
      <div class="panel-indicator"></div>
    </div>
    <div id="editor-container"></div>
  </div>

  <div class="divider" id="divider"></div>

  <div class="panel" id="preview-panel" style="display:flex;flex-direction:column;">
    <div class="panel-bar">
      <div class="panel-label">preview</div>
    </div>
    <iframe id="preview-frame" sandbox="allow-scripts"></iframe>
  </div>

</div>

<div class="footer" id="footer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
<script>
// ── Footer ────────────────────────────────────────────────────────────────────
const footerItems = [
  ['transpiler', 'stub passthrough'],
  ['comments',   '// stripped'],
  ['debounce',   '300ms'],
];
document.getElementById('footer').innerHTML =
  footerItems.map(([k, v]) =>
    `<div class="footer-item">${k}: <b>${v}</b></div>`
  ).join('') +
  `<div class="footer-right">playground-02</div>`;

// ── Initial code ──────────────────────────────────────────────────────────────
const INITIAL = `// index.play — edit me, preview updates live

const greeting = "Hello, Playground"
const version  = "phase 1 · passthrough JS"

// Style the preview document
document.body.style.cssText = \`
  margin: 0;
  min-height: 100vh;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: 'IBM Plex Mono', monospace;
\`

// Heading
const h = document.createElement('div')
h.textContent = greeting
h.style.cssText = \`
  font-size: 32px;
  font-weight: 500;
  color: oklch(80% 0.28 145);
  letter-spacing: 0.04em;
\`
document.body.appendChild(h)

// Subtitle
const sub = document.createElement('div')
sub.textContent = version
sub.style.cssText = \`
  font-size: 11px;
  color: #333;
  letter-spacing: 0.12em;
  text-transform: uppercase;
\`
document.body.appendChild(sub)

// Blinking cursor
const cursor = document.createElement('div')
cursor.textContent = '▮'
cursor.style.cssText = \`
  font-size: 18px;
  color: oklch(80% 0.28 145);
  margin-top: 24px;
  animation: blink 1s step-end infinite;
\`
document.head.insertAdjacentHTML('beforeend',
  '<style>@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}</style>'
)
document.body.appendChild(cursor)`;

// ── Transpiler stub ───────────────────────────────────────────────────────────
function transpile(src) {
  const out = src.split('\n').map(line => {
    const t = line.trimStart();
    if (t.startsWith('//')) return '';
    const i = line.indexOf(' //');
    if (i !== -1) return line.slice(0, i);
    return line;
  }).join('\n');
  return { ok: true, output: out };
}

// ── iframe runner ─────────────────────────────────────────────────────────────
const frame = document.getElementById('preview-frame');

function run(code) {
  const escaped = code.replace(/<\/script>/gi, '<\\/script>');
  frame.srcdoc = `<!DOCTYPE html><html><head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#000}</style>
</head><body>
<script>
window.onerror = function(msg, _s, line) {
  document.body.style.cssText = 'margin:0;padding:24px;background:#000;font-family:monospace';
  document.body.innerHTML = '<pre style="color:oklch(65% 0.22 25);font-size:12px;line-height:1.7">✖ ' + msg + '\\nline ' + line + '</pre>';
  return true;
};
<\/script>
<script>${escaped}<\/script>
</body></html>`;
}

// ── Status ────────────────────────────────────────────────────────────────────
const dot   = document.getElementById('status-dot');
const label = document.getElementById('status-label');

function setStatus(state, text) {
  dot.className = 'status-dot' + (state === 'ok' ? '' : ' ' + state);
  label.textContent = text;
}

// ── Debounce ──────────────────────────────────────────────────────────────────
let timer;
function onChange(code) {
  clearTimeout(timer);
  setStatus('pending', 'compiling');
  timer = setTimeout(() => {
    const r = transpile(code);
    if (r.ok) { run(r.output); setStatus('ok', 'ready'); }
    else       { setStatus('error', 'error'); }
  }, 300);
}

// ── Monaco ────────────────────────────────────────────────────────────────────
require.config({
  paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }
});

require(['vs/editor/editor.main'], function () {
  monaco.editor.defineTheme('void', {
    base: 'vs-dark',
    inherit: true,
    rules: [
      { token: '',            foreground: 'c8c8c8' },
      { token: 'comment',     foreground: '2a2a2a', fontStyle: 'italic' },
      { token: 'keyword',     foreground: '7defa8' },
      { token: 'string',      foreground: '4a9a6a' },
      { token: 'number',      foreground: '5abf85' },
      { token: 'type',        foreground: '3d8a5e' },
      { token: 'delimiter',   foreground: '2a2a2a' },
      { token: 'operator',    foreground: '444444' },
      { token: 'variable',    foreground: 'a8a8a8' },
      { token: 'identifier',  foreground: 'c8c8c8' },
    ],
    colors: {
      'editor.background':                  '#000000',
      'editor.foreground':                  '#c8c8c8',
      'editorLineNumber.foreground':        '#1c1c1c',
      'editorLineNumber.activeForeground':  '#333',
      'editor.selectionBackground':         '#0d2a1a',
      'editor.lineHighlightBackground':     '#080808',
      'editorCursor.foreground':            '#7defa8',
      'editorIndentGuide.background1':      '#111',
      'editorWhitespace.foreground':        '#111',
      'editorBracketMatch.background':      '#0d2a1a',
      'editorBracketMatch.border':          '#7defa822',
      'scrollbar.shadow':                   '#00000000',
      'scrollbarSlider.background':         '#111',
      'scrollbarSlider.hoverBackground':    '#1a1a1a',
      'scrollbarSlider.activeBackground':   '#222',
      'editorGutter.background':            '#000000',
    }
  });

  const ed = monaco.editor.create(document.getElementById('editor-container'), {
    value: INITIAL,
    language: 'javascript',
    theme: 'void',
    fontSize: 13,
    fontFamily: "'IBM Plex Mono', 'JetBrains Mono', monospace",
    fontLigatures: true,
    lineHeight: 22,
    minimap: { enabled: false },
    scrollBeyondLastLine: false,
    padding: { top: 16, bottom: 16 },
    renderLineHighlight: 'line',
    smoothScrolling: true,
    cursorBlinking: 'smooth',
    cursorSmoothCaretAnimation: 'on',
    overviewRulerLanes: 0,
    hideCursorInOverviewRuler: true,
    wordWrap: 'on',
    lineNumbers: 'on',
    glyphMargin: false,
    folding: false,
    renderWhitespace: 'none',
    scrollbar: { verticalScrollbarSize: 4, horizontalScrollbarSize: 4 },
    bracketPairColorization: { enabled: false },
  });

  ed.onDidChangeModelContent(() => onChange(ed.getValue()));

  // Initial run
  run(transpile(INITIAL).output);
  setStatus('ok', 'ready');

  new ResizeObserver(() => ed.layout())
    .observe(document.getElementById('editor-container'));
});

// ── Resizable split ───────────────────────────────────────────────────────────
const divider     = document.getElementById('divider');
const editorPanel = document.getElementById('editor-panel');
const mainEl      = document.getElementById('main');
let dragging      = false;

divider.addEventListener('mousedown', e => {
  dragging = true;
  divider.classList.add('dragging');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'col-resize';
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const r   = mainEl.getBoundingClientRect();
  const pct = Math.min(80, Math.max(20, (e.clientX - r.left) / r.width * 100));
  editorPanel.style.width = pct + '%';
});

document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  divider.classList.remove('dragging');
  document.body.style.userSelect = '';
  document.body.style.cursor = '';
});
</script>
</body>
</html>
